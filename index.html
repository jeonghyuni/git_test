<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byeon Jeong-hyeon | Home</title>
    <!-- 다크모드가 완벽하게 연동되는 Tailwind v3 버전 스크립트 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        /* 원래 마우스 커서는 숨겨줍니다 */
        body, a, button, input {
            cursor: none !important;
        }
        /* 파티클이 담길 캔버스를 배경 최하단에 확실히 고정 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1; /* 다른 콘텐츠들 완전히 뒤로 배치 */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased font-sans min-h-screen flex flex-col justify-between transition-colors duration-300 overflow-x-hidden">

    <!-- 은은한 배경 파티클 캔버스 (body 최상단에 배치) -->
    <canvas id="particle-canvas"></canvas>

    <!-- 짱귀여운 고양이 발바닥 커서 -->
    <div id="animal-cursor" class="fixed text-3xl pointer-events-none z-[9999] -translate-x-1/2 -translate-y-1/2 select-none will-change-transform transition-all duration-100 ease-out">
        🐾
    </div>

    <!-- 스크롤 진행률 상단 바 -->
    <div id="scroll-bar" class="fixed top-0 left-0 h-1 bg-sky-500 z-[100] transition-all duration-75" style="width: 0%;"></div>

    <!-- [공통] 네비게이션 바 -->
    <header class="bg-slate-800 text-white shadow-md sticky top-0 z-50">
        <nav class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-bold tracking-tight">Jeonghyun.B</div>
            <div class="flex items-center space-x-6">
                <ul class="flex space-x-6 text-sm font-medium">
                    <li><a href="index.html" class="text-sky-400 underline font-bold transition-colors">Home</a></li>
                    <li><a href="intro.html" class="hover:text-sky-400 hover:underline transition-colors">About</a></li>
                    <li><a href="projects.html" class="hover:text-sky-400 hover:underline transition-colors">Projects</a></li>
                </ul>
                <!-- 다국어 토글 버튼 -->
                <button onclick="toggleLanguage()" id="lang-btn" class="bg-sky-600 hover:bg-sky-500 px-2.5 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors">
                    🇺🇸 EN
                </button>
                
                <!-- 다크모드 토글 버튼 -->
                <button onclick="toggleDarkMode()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors">
                    🌓 테마 변경
                </button>
            </div>
        </nav>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow space-y-8">
        
        <!-- 소개 섹션 -->
        <section class="bg-white/90 dark:bg-slate-800/90 p-8 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 transition-colors">
            <h2 data-ko="안녕하세요, 변정현입니다." data-en="Hello, I'm Jeonghyeon Byeon." class="text-2xl font-bold text-slate-900 dark:text-white mb-4 border-b-2 border-slate-100 dark:border-slate-700 pb-2">안녕하세요, 변정현입니다.</h2>
            <p data-ko="백엔드 시스템 아키텍처와 효율적인 AI 데이터 파이프라인 구현에 깊은 관심을 가지고 연구하며 개발해 나가고 있습니다." data-en="I am deeply passionate about researching and developing backend system architectures and efficient AI data pipelines." class="text-slate-600 dark:text-slate-300 leading-relaxed mb-4">백엔드 시스템 아키텍처와 효율적인 AI 데이터 파이프라인 구현에 깊은 관심을 가지고 연구하며 개발해 나가고 있습니다.</p>
            <p data-ko="복잡한 데이터를 안정적으로 처리하고, 견고한 서버를 구축하는 과정에서 즐거움을 느깁니다." data-en="I find great joy in reliably processing complex data and building robust server environments." class="text-slate-600 dark:text-slate-300 leading-relaxed">복잡한 데이터를 안정적으로 처리하고, 견고한 서버를 구축하는 과정에서 즐거움을 느깁니다.</p>
            <p data-ko="💡 꿀팁: 화면 어디서나 키보드로 ssafy를 연속으로 타이핑해보세요! (이스터에그)" data-en="💡 Tip: Type 'ssafy' anywhere on the screen for a hidden surprise!" class="text-xs text-slate-400 mt-4">💡 꿀팁: 화면 어디서나 키보드로 <span class="font-mono text-sky-500 font-bold">ssafy</span>를 연속으로 타이핑해보세요! (이스터에그)</p>
        </section>

        <!-- LocalStorage 기반 실시간 방명록 섹션 -->
        <section class="bg-white/90 dark:bg-slate-800/90 p-8 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 transition-colors">
            <h2 data-ko="한 줄 방명록" data-en="Guestbook" class="text-2xl font-bold text-slate-900 dark:text-white mb-4 border-b-2 border-slate-100 dark:border-slate-700 pb-2">한 줄 방명록</h2>
            
            <!-- 입력 폼 -->
            <div class="flex gap-2 mb-6">
                <input type="text" id="guestbook-input" placeholder="응원 한 마디를 남겨주세요!" class="flex-grow px-4 py-2 border border-slate-200 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-sky-500">
                <button onclick="addMessage()" data-ko="등록" data-en="Post" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer transition-colors whitespace-nowrap">등록</button>
            </div>

            <!-- 메시지 출력 리스트 -->
            <ul id="guestbook-list" class="space-y-2 max-h-48 overflow-y-auto pr-2"></ul>
        </section>

    </main>

    <!-- 푸터 영역 -->
    <footer class="bg-slate-100/90 dark:bg-slate-950/90 text-center py-6 border-t border-slate-200 dark:border-slate-800 transition-colors">
        <p class="text-slate-500 text-xs">&copy; 2026 Byeon Jeong-hyeon. All rights reserved.</p>
    </footer>

    <!-- 기능 제어 스크립트 -->
    <script>
        // 다국어 토글 로직
        let currentLang = 'ko';
        function toggleLanguage() {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            const elements = document.querySelectorAll('[data-ko]');
            elements.forEach(el => { el.innerText = el.getAttribute(`data-${currentLang}`); });
            
            // 인풋 플레이스홀더 다국어 분기 처리
            const input = document.getElementById('guestbook-input');
            if(input) input.placeholder = currentLang === 'ko' ? '응원 한 마디를 남겨주세요!' : 'Leave a supportive message!';

            document.getElementById('lang-btn').innerText = currentLang === 'ko' ? '🇺🇸 EN' : '🇰🇷 KO';
        }
        // 배경 파티클 애니메이션 로직
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 50; // 조금 더 잘 보이도록 개수 상향

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
                // 처음 켤 때 화면 전체에 흩뿌려진 상태로 시작하게 수정
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 3 + 1; // 가루 크기를 살짝 더 키움 (시인성 확보)
                this.speedY = Math.random() * 0.5 + 0.2; // 부드러운 속도
                this.opacity = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -10) {
                    this.reset();
                }
            }
            draw() {
                const isDark = document.documentElement.classList.contains('dark');
                // 라이트모드에서는 약간 진한 하늘색, 다크모드에서는 밝은 흰색/하늘색으로 렌더링
                ctx.fillStyle = isDark ? `rgba(224, 242, 254, ${this.opacity})` : `rgba(14, 165, 233, ${this.opacity * 0.4})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();


        // 동물 발바닥 커서 제어
        const cursor = document.getElementById('animal-cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const interactiveElements = document.querySelectorAll('a, button, input');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('scale-150'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('scale-150'));
        });

        // 1. 다크모드 토글
        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // 2. 스크롤 진행률 바
        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrollPercentage = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            document.getElementById('scroll-bar').style.width = scrollPercentage + '%';
        });

        // 3. LocalStorage 방명록
        function loadMessages() {
            const list = document.getElementById('guestbook-list');
            list.innerHTML = '';
            const messages = JSON.parse(localStorage.getItem('messages') || '[]');
            
            if (messages.length === 0) {
                list.innerHTML = `<li class="text-slate-400 text-sm text-center py-4">아직 작성된 방명록이 없습니다. 첫 글을 남겨보세요!</li>`;
                return;
            }

            messages.forEach((msg, index) => {
                const li = document.createElement('li');
                li.className = "bg-slate-50 dark:bg-slate-700/50 px-4 py-2.5 rounded-lg text-sm text-slate-700 dark:text-slate-300 flex justify-between items-center border border-slate-100 dark:border-slate-700/30";
                li.innerHTML = `
                    <span>${msg}</span>
                    <button onclick="deleteMessage(${index})" class="text-rose-500 hover:text-rose-600 text-xs cursor-pointer ml-2">삭제</button>
                `;
                list.appendChild(li);
            });
        }

        function addMessage() {
            const input = document.getElementById('guestbook-input');
            const text = input.value.trim();
            if (!text) return;

            const messages = JSON.parse(localStorage.getItem('messages') || '[]');
            messages.unshift(text);
            localStorage.setItem('messages', JSON.stringify(messages));
            
            input.value = '';
            loadMessages();
        }

        function deleteMessage(index) {
            const messages = JSON.parse(localStorage.getItem('messages') || '[]');
            messages.splice(index, 1);
            localStorage.setItem('messages', JSON.stringify(messages));
            loadMessages();
        }

        // 4. 이스터에그
        let inputLog = '';
        window.addEventListener('keydown', (e) => {
            inputLog += e.key.toLowerCase();
            if (inputLog.length > 10) inputLog = inputLog.substring(inputLog.length - 10);
            
            if (inputLog.includes('ssafy')) {
                alert('🎉 이스터에그 발견! 대단해요 정현님! SSAFY 전공트랙 마스터 칭호를 획득하셨습니다! 🎉');
                inputLog = '';
            }
        });

        window.onload = loadMessages;
    </script>
</body>
</html>
